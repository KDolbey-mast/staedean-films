name: Build The Assembly preview

on:
  push:
    branches:
      - film/the-assembly-storyboard
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install film dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render 20-second film
        run: python scripts/render_film.py assembly
      - name: Upload preview MP4 and timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-assembly-first-pass
          path: |
            outputs/The-Assembly-v1.mp4
            work/the-assembly/timeline.json
          if-no-files-found: warn
          retention-days: 14
